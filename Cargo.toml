[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
crossterm = "0.28"
# Already in the tree via crossterm; used for SIGPIPE handling and for
# recognising a dead terminal (EIO/EPIPE).
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
